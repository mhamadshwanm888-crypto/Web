name: بڵاوکردنەوەی لایڤ لەسەر GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: هێنانەوەی کۆدەکان (Checkout)
        uses: actions/checkout@v4

      - name: ڕێکخستنی نۆد (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: دامەزراندنی پێداویستییەکان (Install dependencies)
        run: npm install

      - name: دروستکردنی فایلی کۆتایی (Build production)
        run: npm run build

      - name: ئامادەکردنی لاپەڕە (Upload Pages artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: بڵاوکردنەوەی لایڤ (Deploy to GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
